<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>BrowserCode VSCode</title>

		<!-- Disable pinch zooming -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

		<!-- Workbench Configuration -->
		<meta id="vscode-workbench-web-configuration" data-settings="{{WORKBENCH_WEB_CONFIGURATION}}">

		<!-- Workbench Auth Session -->
		<meta id="vscode-workbench-auth-session" data-settings="{{WORKBENCH_AUTH_SESSION}}">

		<!-- Workbench Icon/Manifest/CSS -->
		<link rel="icon" type="image/png" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/favicon.ico" />
		<link rel="manifest" href="{{WORKBENCH_WEB_BASE_URL}}/resources/server/manifest.json" crossorigin="use-credentials" />

	</head>

	<body class="web" aria-label="">
	</body>

	<!-- Startup via workbench.web.browsercode.ts -->
	<script src="{{WORKBENCH_WEB_BASE_URL}}/out/vs/workbench/workbench.web.browsercode.js"></script>
	<script>
		// BrowserCode Runtime Detection
		(function() {
			if (!window.browsercode || !window.browsercode.runtime) {
				console.error('[BrowserCode] Runtime not found on window.browsercode.runtime');
				document.body.innerHTML = `
					<div style="padding: 40px; font-family: sans-serif;">
						<h1>BrowserCode Runtime Not Found</h1>
						<p>The BrowserCode runtime must be initialized before loading the workbench.</p>
						<p>Please ensure <code>window.browsercode.runtime</code> is available.</p>
						<pre style="background: #f0f0f0; padding: 10px; border-radius: 4px;">
// Expected structure:
window.browsercode = {
  runtime: {
    capabilities: number,
    session: {
      id: string,
      workspaceUri?: URI,
      ready: Promise&lt;void&gt;
    },
    createProcess(options): Promise&lt;IBrowserCodeProcess&gt;,
    getFileSystemProvider(): IBrowserCodeFileSystemProvider,
    createChannel(name: string): IBrowserCodeChannel,
    executeBrowserCode(code: string): Promise&lt;any&gt;
  }
};
						</pre>
					</div>
				`;
				return;
			}

			console.log('[BrowserCode] Runtime detected');
			console.log('[BrowserCode] Session ID:', window.browsercode.runtime.session.id);
			console.log('[BrowserCode] Capabilities:', window.browsercode.runtime.capabilities);

			// Wait for runtime to be ready
			window.browsercode.runtime.session.ready.then(() => {
				console.log('[BrowserCode] Runtime ready, initializing workbench...');

				const configElement = document.getElementById('vscode-workbench-web-configuration');
				const configMeta = configElement ? configElement.getAttribute('data-settings') : '{}';

				let config;
				try {
					config = JSON.parse(configMeta);
				} catch (e) {
					config = {};
				}

				const workspaceUri = window.browsercode.runtime.session.workspaceUri || config.workspaceUri;

				const workbenchConfig = {
					...config,
					remoteAuthority: 'browsercode',
					workspaceUri: workspaceUri,
					productConfiguration: {
						nameShort: 'BrowserCode',
						nameLong: 'BrowserCode VSCode',
						applicationName: 'browsercode-vscode',
						dataFolderName: '.browsercode-vscode',
						version: '1.0.0',
						...config.productConfiguration
					},
					configurationDefaults: {
						'workbench.enableExperiments': false,
						'workbench.colorTheme': 'Default Dark+',
						...config.configurationDefaults
					}
				};

				console.log('[BrowserCode] Workbench config:', workbenchConfig);

				if (typeof window.createBrowserCodeWorkbench === 'function') {
					window.createBrowserCodeWorkbench(document.body, workbenchConfig)
						.then(() => {
							console.log('[BrowserCode] Workbench initialized successfully');
						})
						.catch((err) => {
							console.error('[BrowserCode] Failed to initialize workbench:', err);
							document.body.innerHTML = `
								<div style="padding: 40px; font-family: sans-serif;">
									<h1>Failed to Initialize Workbench</h1>
									<p>An error occurred while starting BrowserCode VSCode:</p>
									<pre style="background: #f0f0f0; padding: 10px; border-radius: 4px;">${err.stack || err.message || err}</pre>
								</div>
							`;
						});
				} else {
					console.error('[BrowserCode] createBrowserCodeWorkbench function not found');
					document.body.innerHTML = `
						<div style="padding: 40px; font-family: sans-serif;">
							<h1>Workbench Initialization Function Not Found</h1>
							<p>The <code>createBrowserCodeWorkbench</code> function is not available.</p>
							<p>Please ensure <code>workbench.web.browsercode.js</code> loaded correctly.</p>
						</div>
					`;
				}
			}).catch((err) => {
				console.error('[BrowserCode] Runtime failed to initialize:', err);
				document.body.innerHTML = `
					<div style="padding: 40px; font-family: sans-serif;">
						<h1>Runtime Initialization Failed</h1>
						<p>The BrowserCode runtime failed to initialize:</p>
						<pre style="background: #f0f0f0; padding: 10px; border-radius: 4px;">${err.stack || err.message || err}</pre>
					</div>
				`;
			});
		})();
	</script>
</html>
