version: '3.8'

services:
  openvscode-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openvscode-server
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=9000
    volumes:
      - ./out:/app/out
      - ./extensions:/app/extensions
      - workspace-volume:/workspace
    networks:
      - openvscode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for better web serving
  nginx:
    image: nginx:alpine
    container_name: openvscode-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openvscode-server
    networks:
      - openvscode-network
    restart: unless-stopped

networks:
  openvscode-network:
    driver: bridge

volumes:
  workspace-volume:
    driver: local
