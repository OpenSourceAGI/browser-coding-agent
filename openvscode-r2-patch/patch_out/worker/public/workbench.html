<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenVSCode Workbench</title>
    <style>
      html,
      body,
      #workbench-root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="workbench-root"></div>
    <script type="module">
      import { URI } from './out/vs/base/common/uri.js';
      import { create } from './out/vs/code/browser/workbench/workbench.js';

      const search = new URLSearchParams(location.search);
      const folderUri = search.get('folderUri') || 'r2fs:/';

      const config = {
        workspaceProvider: {
          trusted: true,
          workspace: {
            folderUri: URI.parse(folderUri)
          },
          async open(workspace) {
            const next = new URL(location.href);
            next.searchParams.set('folderUri', workspace.folderUri.toString());
            location.href = next.toString();
            return true;
          }
        },
        // Keep this unset so VS Code does not attempt management/REH websocket at boot.
        remoteAuthority: undefined,
        additionalBuiltinExtensions: [
          {
            scheme: 'https',
            authority: 'open-vsx.org',
            path: '/vscode/gallery'
          }
        ],
        configurationDefaults: {
          'workbench.startupEditor': 'none'
        }
      };

      create(document.getElementById('workbench-root'), config);
    </script>
  </body>
</html>
